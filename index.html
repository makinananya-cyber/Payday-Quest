<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payday Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Payday Quest: a free, game-style money course for teens with lessons, quizzes, games and a life simulator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: an Indigo sidebar (bottom tab bar on phones) beside a calm azure-mist workspace; content sits in soft palette-coloured cards. Only the six palette colours, their label inks, and light tints of them. */
:root{
  --matcha:#8FB78F; --pistachio:#CBE6C7; --azure:#B4CCCF; --indigo:#28536B; --orchid:#F3A5BC; --peach:#FFC49B;
  --forest:#1E3D1F; --maroon:#7A1E3A; --deep:#1B3B4D;
  --bg:#E5EDEE; --surface:#F7FAFA; --surface-2:#EEF4F4; --ink:var(--deep); --ink-soft:#4A6878; --line:rgba(40,83,107,.15);
  --pist-tint:#E6F3E4; --peach-tint:#FFEADB; --orchid-tint:#FBE2EA; --azure-tint:#DCE8E9;
  --shadow:0 1px 2px rgba(27,59,77,.06), 0 10px 28px -14px rgba(27,59,77,.28);
  --f-serif:"Fraunces", "Iowan Old Style", Georgia, serif;
  --f-sans:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:20px; --r-sm:14px;
  --side-w:250px;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-sans); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:70; background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-serif); font-weight:600; line-height:1.15; margin:0; text-wrap:balance; letter-spacing:-.01em; font-variation-settings:"opsz" 72}
h1{font-size:clamp(2rem,4.4vw,3.1rem)}
h2{font-size:clamp(1.5rem,3vw,2.05rem)}
h3{font-size:1.25rem}
p{margin:0}
em.it{font-family:var(--f-serif); font-style:italic; font-weight:400}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--indigo); outline-offset:3px; border-radius:10px}
.label{font-size:.72rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.side{position:fixed; top:0; bottom:0; left:0; width:var(--side-w); background:var(--indigo); color:var(--azure); display:flex; flex-direction:column; padding:calc(26px + env(safe-area-inset-top,0px)) 16px 22px max(16px, env(safe-area-inset-left,0px)); z-index:40}
.logo{display:flex; align-items:center; gap:12px; text-decoration:none; color:#F7FAFA; padding:0 10px 26px}
.logo svg{width:38px; height:38px; flex:none}
.logo b{font-family:var(--f-serif); font-size:1.32rem; font-weight:600; letter-spacing:-.01em}
.logo b i{font-weight:400; color:var(--peach)}
.nav{display:grid; gap:4px}
.nav a{display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:14px; text-decoration:none; color:var(--azure); font-weight:700; font-size:.98rem; transition:background .2s, color .2s}
.nav a svg{width:22px; height:22px; flex:none}
.nav a:hover{background:rgba(180,204,207,.12); color:#F7FAFA}
.nav a[aria-current="page"]{background:var(--pistachio); color:var(--forest)}
.side-card{margin-top:auto; padding:16px; border-radius:16px; background:rgba(180,204,207,.12); display:grid; gap:10px}
.side-card .row{display:flex; justify-content:space-between; align-items:center; font-size:.86rem; font-weight:700; color:var(--azure)}
.side-card .row b{color:#F7FAFA; font-size:1rem}
.side-card .bar{height:8px; border-radius:99px; background:rgba(180,204,207,.2); overflow:hidden}
.side-card .bar i{display:block; height:100%; background:var(--peach); border-radius:inherit; transition:width .6s}

.shell{margin-left:var(--side-w); min-height:100vh}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); border-bottom:1px solid var(--line)}
.topbar .in{max-width:1120px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:14px var(--gr) 14px var(--gl)}
.crumbs{display:flex; align-items:center; gap:8px; font-weight:700; font-size:.95rem; min-width:0; flex-wrap:wrap}
.crumbs a{color:var(--ink-soft); text-decoration:none}
.crumbs a:hover{color:var(--ink); text-decoration:underline}
.crumbs span.sep{color:var(--ink-soft); opacity:.5}
.chips{margin-left:auto; display:flex; gap:8px; align-items:center; flex:none}
.chip{display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:99px; font-weight:800; font-size:.86rem; white-space:nowrap; border:1px solid transparent}
.chip svg{width:18px; height:18px}
.chip.streak{background:var(--peach-tint); color:var(--maroon)}
.chip.xp{background:var(--pist-tint); color:var(--forest)}
.chip.goal{background:var(--surface); border-color:var(--line); padding:4px 12px 4px 4px}
.ring{width:30px; height:30px}
.chip.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.15)}}
.mobile-logo{display:none}

.page{max-width:1120px; margin:0 auto; padding:30px var(--gr) 70px var(--gl)}
.view-enter{animation:enter .4s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.001; transform:translateY(10px)}}

/* ---------- generic ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; border:0; border-radius:14px; padding:13px 22px; font-weight:800; font-size:1rem; text-decoration:none; transition:transform .15s, box-shadow .15s, background .2s; letter-spacing:.01em}
.btn svg{width:18px; height:18px}
.btn-primary{background:var(--indigo); color:#F7FAFA; box-shadow:0 4px 0 var(--deep)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:active{transform:translateY(3px); box-shadow:0 1px 0 var(--deep)}
.btn-soft{background:var(--azure-tint); color:var(--deep)}
.btn-soft:hover{background:var(--azure)}
.btn-line{background:transparent; border:2px solid var(--line); color:var(--ink)}
.btn-line:hover{border-color:var(--indigo)}
.btn-good{background:var(--matcha); color:var(--forest); box-shadow:0 4px 0 #5f8a5f}
.btn-bad{background:var(--orchid); color:var(--maroon); box-shadow:0 4px 0 #c97b93}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none!important}
.btn-sm{padding:9px 14px; font-size:.9rem; border-radius:12px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:99px; font-size:.78rem; font-weight:800}
.t-peach{background:var(--peach); color:var(--maroon)}
.t-orchid{background:var(--orchid); color:var(--maroon)}
.t-pistachio{background:var(--pistachio); color:var(--forest)}
.t-matcha{background:var(--matcha); color:var(--forest)}
.t-azure{background:var(--azure); color:var(--deep)}
.t-indigo{background:var(--indigo); color:var(--pistachio)}
.head{display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; margin-bottom:22px}
.head p{max-width:56ch}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
.grid2>*,.grid3>*{min-width:0}
.bar{height:10px; border-radius:99px; background:var(--azure-tint); overflow:hidden}
.bar i{display:block; height:100%; border-radius:inherit; background:var(--matcha); transition:width .6s cubic-bezier(.2,.9,.3,1)}
.stack{display:grid; gap:14px}
.field{display:grid; gap:6px}
.field label{font-weight:700; font-size:.92rem}
.field small{color:var(--ink-soft); font-size:.82rem}
.input, select.input, textarea.input{width:100%; padding:12px 14px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-size:1rem; transition:border-color .15s}
.input:focus{outline:none; border-color:var(--indigo)}
textarea.input{min-height:220px; resize:vertical; line-height:1.6}
input[type=range]{width:100%; accent-color:var(--indigo)}
.notice{display:flex; gap:12px; padding:14px 16px; border-radius:14px; background:var(--azure-tint); font-size:.95rem}
.notice svg{width:22px; height:22px; flex:none; color:var(--indigo); margin-top:1px}
.notice.good{background:var(--pist-tint); color:var(--forest)}
.notice.good svg{color:var(--forest)}
.notice.bad{background:var(--orchid-tint); color:var(--maroon)}
.notice.bad svg{color:var(--maroon)}
.tabs{display:flex; gap:6px; flex-wrap:wrap; padding:5px; border-radius:16px; background:var(--azure-tint); width:fit-content; max-width:100%}
.tabs button{border:0; background:transparent; padding:9px 16px; border-radius:12px; font-weight:800; font-size:.9rem; color:var(--ink-soft)}
.tabs button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

/* ---------- home ---------- */
.hero{display:grid; grid-template-columns:1.25fr .75fr; gap:20px; margin-bottom:20px}
.hero>*{min-width:0}
.welcome{padding:clamp(24px,4vw,40px); border-radius:26px; background:var(--indigo); color:var(--azure); position:relative; overflow:hidden; display:grid; gap:14px; align-content:start}
.welcome h1{color:#F7FAFA}
.welcome h1 em{color:var(--peach); font-style:italic; font-weight:400}
.welcome p{max-width:48ch; font-size:1.06rem}
.welcome .btn-primary{background:var(--peach); color:var(--maroon); box-shadow:0 4px 0 #c98f66}
.welcome .deco{position:absolute; right:-40px; bottom:-60px; width:240px; height:240px; opacity:.9; pointer-events:none}
.welcome .acts{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; position:relative}
.welcome .btn-ghost{background:rgba(180,204,207,.14); color:#F7FAFA}
.today{padding:22px; display:grid; gap:14px; align-content:start}
.goal-big{display:flex; align-items:center; gap:16px}
.goal-big svg{width:84px; height:84px; flex:none}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; font-size:.72rem; font-weight:800; color:var(--ink-soft)}
.week i{display:grid; place-items:center; width:100%; aspect-ratio:1; max-width:34px; margin:4px auto 0; border-radius:50%; background:var(--azure-tint); font-style:normal; color:var(--ink-soft)}
.week i.on{background:var(--peach); color:var(--maroon)}
.week i.today{outline:2px solid var(--indigo); outline-offset:2px}
.continue{display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center; padding:20px 22px; margin-bottom:28px}
.continue .badge-u{width:58px; height:58px; border-radius:18px; display:grid; place-items:center; font-family:var(--f-serif); font-size:1.4rem; font-weight:600}
.continue>div{min-width:0}
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
.tile{border-radius:var(--r); padding:24px; text-decoration:none; display:grid; gap:10px; align-content:start; min-height:210px; position:relative; overflow:hidden; transition:transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s}
.tile:hover{transform:translateY(-4px); box-shadow:0 18px 30px -18px rgba(27,59,77,.5)}
.tile h3{font-size:1.45rem}
.tile p{font-size:.96rem; opacity:.9}
.tile .go{margin-top:auto; font-weight:800; font-size:.9rem; display:flex; align-items:center; gap:6px}
.tile svg.big{position:absolute; right:-10px; top:-10px; width:110px; height:110px; opacity:.28}
.tipcard{margin-top:28px; padding:24px; display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center}
.tipcard .k{font-family:var(--f-serif); font-size:2.6rem; font-weight:600; color:var(--indigo); line-height:1}
.tipcard>div{min-width:0}

/* ---------- learn path ---------- */
.learn-wrap{display:grid; grid-template-columns:1fr 300px; gap:26px; align-items:start}
.learn-wrap>*{min-width:0}
.unit{margin-bottom:38px}
.unit-banner{border-radius:22px; padding:22px 24px; display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap}
.unit-banner .label{color:inherit; opacity:.75}
.unit-banner h2{font-size:clamp(1.35rem,2.6vw,1.8rem); margin-top:4px}
.unit-banner p{opacity:.88; font-size:.95rem; margin-top:4px; max-width:52ch}
.unit-banner .prog{min-width:120px; text-align:right; font-weight:800; font-size:.86rem}
.unit-banner .prog .bar{background:rgba(255,255,255,.45); margin-top:6px}
.unit-banner.t-indigo .prog .bar i{background:var(--peach)}
.path{display:grid; gap:14px; padding:26px 0 6px; justify-items:center}
.node-row{display:flex; align-items:center; gap:16px; width:min(580px,100%)}
.node-label{flex:1}
.node{position:relative; width:72px; height:72px; border-radius:50%; border:0; display:grid; place-items:center; flex:none; box-shadow:0 6px 0 rgba(27,59,77,.22); transition:transform .15s}
.node:hover:not([disabled]){transform:translateY(-2px)}
.node:active:not([disabled]){transform:translateY(4px); box-shadow:0 2px 0 rgba(27,59,77,.22)}
.node svg{width:30px; height:30px}
.node[disabled]{background:var(--azure-tint)!important; color:var(--ink-soft)!important; box-shadow:0 6px 0 rgba(27,59,77,.1); cursor:not-allowed}
.node.current::after{content:""; position:absolute; inset:-9px; border-radius:50%; border:3px solid var(--indigo); animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07); opacity:.45}}
.node .crown{position:absolute; bottom:-6px; right:-6px; width:26px; height:26px; border-radius:50%; background:var(--peach); color:var(--maroon); display:grid; place-items:center; font-size:.7rem; font-weight:800; border:2px solid var(--surface)}
.node-label{min-width:0}
.node-label b{display:block; font-family:var(--f-serif); font-size:1.08rem; font-weight:600; line-height:1.25}
.node-label small{color:var(--ink-soft); font-size:.82rem; font-weight:600}
.learn-side{position:sticky; top:calc(env(safe-area-inset-top,0px) + 86px); display:grid; gap:16px}
.learn-side .card{padding:20px}
.unit-jump{display:grid; gap:6px; margin-top:10px}
.unit-jump a{display:flex; justify-content:space-between; gap:10px; padding:9px 12px; border-radius:12px; text-decoration:none; font-weight:700; font-size:.9rem}
.unit-jump a:hover{background:var(--azure-tint)}
.unit-jump a span{color:var(--ink-soft); font-variant-numeric:tabular-nums}

/* ---------- lesson player ---------- */
.lesson{max-width:780px; margin:0 auto}
.lesson-top{display:flex; align-items:center; gap:14px; margin-bottom:22px}
.xbtn{width:44px; height:44px; border-radius:14px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none; text-decoration:none}
.xbtn svg{width:20px; height:20px}
.lesson-top .bar{flex:1; height:14px}
.lesson-top .bar i{background:var(--matcha)}
.screen{padding:clamp(22px,4vw,40px); border-radius:26px; display:grid; gap:16px}
.screen .label{color:inherit; opacity:.75}
.screen h2{font-size:clamp(1.55rem,3.4vw,2.2rem)}
.screen .body{display:grid; gap:12px; font-size:1.08rem; line-height:1.7; max-width:62ch}
.screen ul{margin:0; padding-left:0; list-style:none; display:grid; gap:8px}
.screen li{position:relative; padding-left:26px}
.screen li::before{content:""; position:absolute; left:4px; top:.6em; width:10px; height:10px; border-radius:3px; background:currentColor; opacity:.55; transform:rotate(45deg)}
.screen .ex{background:rgba(247,250,250,.72); border-radius:16px; padding:14px 18px; color:var(--deep)}
.screen .ex b{display:block; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; margin-bottom:2px; opacity:.75}
.screen .tipline{font-family:var(--f-serif); font-style:italic; font-size:1.12rem}
.lesson-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:20px; flex-wrap:wrap}
.intro-list{display:grid; gap:8px; margin:6px 0 0; padding:0; list-style:none}
.intro-list li{display:flex; gap:10px; align-items:baseline}
.intro-list li::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--matcha); flex:none; transform:translateY(-1px)}

/* questions */
.q{padding:clamp(22px,4vw,36px); display:grid; gap:18px}
.q .qtype{display:flex; gap:8px; align-items:center}
.q .prompt{font-family:var(--f-serif); font-size:clamp(1.3rem,3vw,1.7rem); font-weight:600; line-height:1.3}
.opts{display:grid; gap:10px}
.opt{display:flex; align-items:center; gap:14px; text-align:left; padding:15px 16px; border-radius:16px; border:2px solid var(--line); background:var(--surface); font-weight:600; font-size:1.02rem; box-shadow:0 3px 0 var(--line); transition:border-color .15s, background .15s}
.opt:hover:not([disabled]){border-color:var(--indigo)}
.opt kbd{font-family:var(--f-sans); font-size:.78rem; font-weight:800; width:28px; height:28px; display:grid; place-items:center; border-radius:9px; border:2px solid var(--line); flex:none}
.opt.sel{border-color:var(--indigo); background:var(--azure-tint)}
.opt.right{border-color:var(--matcha); background:var(--pist-tint); color:var(--forest)}
.opt.wrong{border-color:var(--orchid); background:var(--orchid-tint); color:var(--maroon)}
.tf{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tf .opt{justify-content:center; font-size:1.1rem; font-weight:800; padding:22px}
.sentence{font-size:1.2rem; line-height:2.3; font-weight:600}
.blank{display:inline-flex; min-width:110px; justify-content:center; padding:2px 12px; margin:0 4px; border-bottom:3px solid var(--indigo); border-radius:8px 8px 0 0; background:var(--azure-tint); font-weight:800; cursor:pointer; vertical-align:baseline; line-height:1.6}
.blank.filled{background:var(--peach-tint); color:var(--maroon)}
.blank input{border:0; background:transparent; width:150px; text-align:center; font-weight:800; padding:0; outline:none}
.blank.right{background:var(--pist-tint); color:var(--forest); border-color:var(--matcha)}
.blank.wrong{background:var(--orchid-tint); color:var(--maroon); border-color:var(--orchid)}
.bank{display:flex; flex-wrap:wrap; gap:10px}
.tilew{padding:10px 16px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-weight:700; box-shadow:0 3px 0 var(--line); touch-action:none; user-select:none; -webkit-user-select:none}
.tilew:hover{border-color:var(--indigo)}
.tilew.used{visibility:hidden}
.tilew.dragging{opacity:.3}
.ghost{position:fixed; z-index:200; pointer-events:none; transform:translate(-50%,-50%) rotate(-3deg); box-shadow:0 14px 28px -10px rgba(27,59,77,.5)}
.answer-row{min-height:64px; padding:10px; border-radius:16px; border:2px dashed var(--azure); display:flex; flex-wrap:wrap; gap:10px; align-content:flex-start}
.answer-row.over, .bucket.over{border-color:var(--indigo); background:var(--azure-tint)}
.answer-row .tilew{counter-increment:ord}
.answer-row{counter-reset:ord}
.answer-row .tilew::before{content:counter(ord) ". "; color:var(--ink-soft)}
.answer-row:empty::after{content:"Tap or drag the steps here in order"; color:var(--ink-soft); font-size:.9rem; padding:10px}
.buckets{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}
.bucket{min-height:150px; border-radius:16px; border:2px dashed var(--azure); padding:12px; display:flex; flex-direction:column; gap:8px}
.bucket h4{font-family:var(--f-sans); font-size:.85rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; text-align:center; padding:6px; border-radius:10px}
.bucket .tilew{font-size:.92rem; padding:8px 12px}
.tilew.right{border-color:var(--matcha); background:var(--pist-tint); color:var(--forest)}
.tilew.wrong{border-color:var(--orchid); background:var(--orchid-tint); color:var(--maroon)}
.match{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.match .col{display:grid; gap:10px; align-content:start}
.match .tilew{text-align:left; font-size:.95rem; min-height:56px}
.match .tilew.sel{border-color:var(--indigo); background:var(--azure-tint)}
.match .tilew.done{border-color:var(--matcha); background:var(--pist-tint); color:var(--forest); opacity:.7}
.match .tilew.bad{animation:shake .35s; border-color:var(--orchid)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.numwrap{display:flex; align-items:center; gap:10px; max-width:320px}
.numwrap .pre{font-weight:800; font-size:1.3rem}
.numwrap .input{font-size:1.3rem; font-weight:800}
.kw-list{display:grid; gap:8px}
.kw{display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border-radius:12px; font-size:.95rem}
.kw.hit{background:var(--pist-tint); color:var(--forest)}
.kw.miss{background:var(--orchid-tint); color:var(--maroon)}
.kw.warn{background:var(--peach-tint); color:var(--maroon)}
.kw b{flex:none}

.sheet{position:fixed; left:0; right:0; bottom:0; z-index:60; padding:18px var(--gr) calc(18px + env(safe-area-inset-bottom,0px)) var(--gl); animation:sheetUp .3s cubic-bezier(.2,.9,.3,1.1); border-top:1px solid var(--line)}
.sheet .in{max-width:780px; margin:0 auto; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.sheet .in>div{min-width:0; flex:1 1 300px}
.sheet h3{font-size:1.3rem}
.sheet p{font-size:.98rem; margin-top:4px}
.sheet.good{background:var(--pist-tint); color:var(--forest)}
.sheet.bad{background:var(--orchid-tint); color:var(--maroon)}
.sheet.neutral{background:var(--surface)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.checkbar{display:flex; justify-content:flex-end; margin-top:18px; gap:10px; flex-wrap:wrap}

.result{text-align:center; padding:clamp(28px,5vw,48px) 22px; display:grid; gap:16px; justify-items:center}
.result .medal{width:110px; height:110px}
.result .stats{display:grid; grid-template-columns:repeat(3,minmax(0,140px)); gap:12px}
.result .stat{border-radius:16px; padding:12px; border:2px solid}
.result .stat small{display:block; font-size:.72rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase}
.result .stat b{font-family:var(--f-serif); font-size:1.5rem}

/* ---------- hubs (games / sim) ---------- */
.hub{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
.hub a{border-radius:var(--r); padding:22px; text-decoration:none; display:grid; gap:8px; align-content:start; min-height:190px; transition:transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s; position:relative; overflow:hidden}
.hub a:hover{transform:translateY(-4px); box-shadow:0 18px 30px -18px rgba(27,59,77,.5)}
.hub a .ico{width:50px; height:50px; border-radius:14px; display:grid; place-items:center; background:rgba(247,250,250,.6); margin-bottom:6px}
.hub a .ico svg{width:26px; height:26px}
.hub a h3{font-size:1.3rem}
.hub a p{font-size:.94rem; opacity:.9}
.hub a .meta{margin-top:auto; font-size:.8rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; opacity:.8; padding-top:8px}
.hub a.feature{grid-column:span 2; min-height:220px}
.panel{padding:clamp(20px,3.5vw,32px)}
.setup{display:grid; gap:18px; max-width:760px}
.choice-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px}
.pick{border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:12px 14px; text-align:left; font-weight:700; font-size:.94rem; display:grid; gap:2px}
.pick small{font-weight:600; color:var(--ink-soft); font-size:.8rem}
.pick[aria-pressed="true"]{border-color:var(--indigo); background:var(--azure-tint)}

/* flashcards */
.flash-stage{perspective:1400px; max-width:620px; margin:0 auto; width:100%}
.flash{position:relative; width:100%; aspect-ratio:3/2; max-height:380px; cursor:pointer; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.2,.8,.2,1); border:0; padding:0; background:none}
.flash.flip{transform:rotateY(180deg)}
.flash .face{position:absolute; inset:0; border-radius:24px; display:grid; place-items:center; padding:28px; backface-visibility:hidden; -webkit-backface-visibility:hidden; text-align:center; box-shadow:var(--shadow)}
.flash .face h3{font-size:clamp(1.6rem,4vw,2.4rem)}
.flash .face p{font-size:clamp(1rem,2.3vw,1.15rem); line-height:1.6; max-width:44ch}
.flash .back{transform:rotateY(180deg)}
.flash .face small{position:absolute; bottom:16px; left:0; right:0; font-size:.75rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.6}

/* memory */
.memory{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.mcard{aspect-ratio:4/3; border-radius:16px; border:0; perspective:800px; background:none; padding:0}
.mcard .inner{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .45s}
.mcard.open .inner,.mcard.done .inner{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute; inset:0; border-radius:16px; display:grid; place-items:center; padding:10px; backface-visibility:hidden; -webkit-backface-visibility:hidden; font-weight:700; font-size:clamp(.72rem,1.6vw,.92rem); line-height:1.3; text-align:center}
.mcard .f{background:var(--indigo); color:var(--azure)}
.mcard .f svg{width:34%; height:34%; opacity:.6}
.mcard .b{transform:rotateY(180deg); background:var(--surface); border:2px solid var(--line); color:var(--ink)}
.mcard .b.term{font-family:var(--f-serif); font-size:clamp(.9rem,2vw,1.15rem); font-weight:600}
.mcard.done .b{background:var(--pist-tint); border-color:var(--matcha); color:var(--forest)}

/* crossword */
.cw-wrap{display:grid; grid-template-columns:1fr; gap:24px; align-items:start}
.cw-wrap .cw{margin:0 auto}
.cw-wrap>*{min-width:0}
.cw-scroll{overflow-x:auto; max-width:100%; padding-bottom:6px}
.cw{display:grid; gap:2px; width:max-content; background:transparent}
.cw .cell{width:34px; height:34px; position:relative}
.cw .cell.on{background:var(--surface); border:2px solid var(--indigo); border-radius:6px}
.cw .cell input{width:100%; height:100%; border:0; background:transparent; text-align:center; font-weight:800; font-size:1.05rem; text-transform:uppercase; padding:0; color:var(--deep); border-radius:4px}
.cw .cell input:focus{outline:none; background:var(--peach-tint)}
.cw .cell.hl input{background:var(--azure-tint)}
.cw .cell.right{border-color:var(--matcha); background:var(--pist-tint)}
.cw .cell.wrong{border-color:var(--orchid); background:var(--orchid-tint)}
.cw .cell sup{position:absolute; top:1px; left:3px; font-size:.58rem; font-weight:800; color:var(--ink-soft); pointer-events:none; line-height:1}
.clues{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.clues h4{font-family:var(--f-sans); font-size:.8rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px}
.clues ol{margin:0; padding:0; list-style:none; display:grid; gap:6px}
.clues li{font-size:.92rem; padding:6px 10px; border-radius:10px; cursor:pointer}
.clues li b{margin-right:6px}
.clues li.act{background:var(--azure-tint)}
.clues li.solved{color:var(--forest); text-decoration:line-through; text-decoration-color:var(--matcha)}

/* speed */
.speed-stage{border-radius:22px; background:var(--indigo); color:#F7FAFA; padding:28px; min-height:230px; display:grid; place-items:center; text-align:center; position:relative; overflow:hidden}
.speed-stage .stmt{font-family:var(--f-serif); font-size:clamp(1.3rem,3.2vw,1.8rem); font-weight:500; max-width:30ch}
.speed-stage .hud{position:absolute; top:14px; left:18px; right:18px; display:flex; justify-content:space-between; font-weight:800; font-size:.86rem; color:var(--azure)}
.speed-stage .timer{position:absolute; left:18px; right:18px; top:42px; height:6px; border-radius:99px; background:rgba(180,204,207,.2); overflow:hidden}
.speed-stage .timer i{display:block; height:100%; width:100%; background:var(--peach)}
.speed-stage .fb{position:absolute; bottom:14px; left:18px; right:18px; font-size:.9rem; color:var(--pistachio)}
.pop-in{animation:popIn .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popIn{from{transform:scale(.92); opacity:.001}}

/* simulator */
.sim-grid{display:grid; grid-template-columns:290px 1fr; gap:20px; align-items:start}
.sim-grid>*{min-width:0}
.sim-side{position:sticky; top:calc(env(safe-area-inset-top,0px) + 86px); padding:20px; display:grid; gap:14px}
.meter{display:grid; gap:6px}
.meter .top{display:flex; justify-content:space-between; gap:8px; font-size:.86rem; font-weight:700}
.health{display:flex; align-items:center; gap:14px}
.health svg{width:70px; height:70px; flex:none}
.paystub{background:var(--surface-2); border:1px dashed var(--indigo); border-radius:16px; padding:18px 20px; max-width:520px}
.paystub .r{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-variant-numeric:tabular-nums; opacity:0; transform:translateY(6px); transition:all .35s}
.paystub .r.show{opacity:1; transform:none}
.paystub .r.minus span:last-child{color:var(--maroon)}
.paystub .r.total{border-top:2px solid var(--deep); margin-top:8px; padding-top:10px; font-weight:800; font-size:1.1rem}
.paystub .r.total span:last-child{font-family:var(--f-serif); font-size:1.5rem}
.alloc-row{display:grid; gap:6px}
.alloc-row .top{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap}
.alloc-row output{font-family:var(--f-serif); font-weight:600; font-size:1.25rem}
.stackbar{display:flex; height:22px; border-radius:8px; overflow:hidden; background:var(--azure-tint)}
.stackbar i{display:block; height:100%; transition:width .3s}
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:.84rem; color:var(--ink-soft); font-weight:600}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend span::before{content:""; width:11px; height:11px; border-radius:3px; background:var(--sw)}
.event{border-radius:22px; padding:clamp(20px,3vw,28px); display:grid; gap:14px}
.event .choices{display:grid; gap:10px}
.event .ch{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; border-radius:14px; border:0; background:rgba(247,250,250,.75); color:var(--deep); text-align:left; font-weight:700; transition:transform .15s, background .15s}
.event .ch:hover:not([disabled]){transform:translateX(4px); background:var(--surface)}
.event .ch span{font-weight:600; font-size:.88rem; white-space:nowrap; font-variant-numeric:tabular-nums}
.linkl{display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:.88rem; color:var(--indigo)}
.donut{width:180px; height:180px; flex:none}
.calc-out{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.calc-out>div{border-radius:16px; padding:14px 16px; background:var(--surface-2); border:1px solid var(--line)}
.calc-out small{display:block; font-size:.78rem; font-weight:700; color:var(--ink-soft)}
.calc-out b{font-family:var(--f-serif); font-size:1.4rem; font-weight:600; font-variant-numeric:tabular-nums}
.calc-out>div.hl{background:var(--pistachio); border-color:transparent; color:var(--forest)}
.calc-out>div.hl small{color:var(--forest)}
canvas.chart{width:100%; height:240px; display:block}
.exp-row{display:grid; grid-template-columns:1fr 130px 40px; gap:8px; align-items:center}
.exp-row.exp4{grid-template-columns:1fr 96px 104px 40px}
.sticky-panel{position:sticky; top:calc(env(safe-area-inset-top,0px) + 86px)}
.iconbtn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center}
.iconbtn svg{width:18px; height:18px}

/* progress */
.prof{display:grid; grid-template-columns:1.2fr .8fr; gap:18px; margin-bottom:26px}
.prof>*{min-width:0}
.prof-hero{background:var(--indigo); color:var(--azure); border-radius:26px; padding:28px; display:grid; gap:14px}
.prof-hero h2{color:#F7FAFA}
.prof-hero .bar{background:rgba(180,204,207,.2); height:12px}
.prof-hero .bar i{background:var(--peach)}
.prof-hero .mini{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.prof-hero .mini div{background:rgba(180,204,207,.12); border-radius:14px; padding:12px}
.prof-hero .mini b{display:block; font-family:var(--f-serif); font-size:1.5rem; color:#F7FAFA; font-weight:600}
.prof-hero .mini small{font-size:.76rem; font-weight:700}
.badge-sec{margin-bottom:26px}
.badge-sec h3{margin-bottom:12px}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px}
.bdg{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; padding:16px; border-radius:18px; background:var(--surface); border:1px solid var(--line)}
.bdg>div{min-width:0}
.bdg .med{width:58px; height:58px}
.bdg h4{font-family:var(--f-sans); font-size:.95rem; font-weight:800}
.bdg p{font-size:.8rem; color:var(--ink-soft); line-height:1.4}
.bdg .bar{height:6px; margin-top:6px}
.bdg.locked .med{opacity:.4; filter:grayscale(1)}
.chartbox{padding:22px}
.goalpick{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}

/* toast + confetti */
.toasts{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:90; display:grid; gap:8px; justify-items:center; pointer-events:none; width:max-content; max-width:calc(100% - 32px)}
.toast{background:var(--deep); color:#F7FAFA; padding:12px 18px; border-radius:14px; font-weight:700; box-shadow:0 14px 30px -10px rgba(27,59,77,.5); animation:tIn .4s cubic-bezier(.2,.9,.3,1.3), tOut .4s 2.8s forwards; font-size:.95rem}
.toast b{color:var(--peach)}
@keyframes tIn{from{transform:translateY(20px) scale(.9); opacity:.001}}
@keyframes tOut{to{transform:translateY(10px); opacity:0}}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:95}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .learn-wrap{grid-template-columns:1fr}
  .learn-side{position:static; order:-1}
  .learn-side .unit-jump{display:none}
}
@media (max-width:980px){
  :root{--side-w:84px}
  .logo b,.nav a span,.side-card{display:none}
  .logo{justify-content:center; padding:0 0 22px}
  .nav a{justify-content:center; padding:13px}
  .hero,.prof{grid-template-columns:1fr}
  .tiles,.hub,.grid3{grid-template-columns:1fr 1fr}
  .hub a.feature{grid-column:span 2}
  .sim-grid,.cw-wrap{grid-template-columns:1fr}
  .sim-side,.sticky-panel{position:static}
}
@media (max-width:720px){
  .side{top:auto; width:auto; right:0; height:auto; flex-direction:row; padding:6px var(--gr) calc(6px + env(safe-area-inset-bottom,0px)) var(--gl); background:var(--indigo)}
  .side .logo{display:none}
  .nav{grid-auto-flow:column; grid-auto-columns:1fr; width:100%; gap:2px}
  .nav a{flex-direction:column; gap:3px; padding:8px 4px; font-size:.68rem; border-radius:12px}
  .nav a span{display:block}
  .nav a svg{width:22px; height:22px}
  .shell{margin-left:0; padding-bottom:84px}
  .mobile-logo{display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); font-family:var(--f-serif); font-weight:600; font-size:1.1rem}
  .mobile-logo svg{width:30px; height:30px}
  .crumbs{display:none}
  .chip.xp span.lbl{display:none}
  .grid2,.tiles,.hub,.grid3,.clues,.calc-out{grid-template-columns:1fr}
  .hub a.feature{grid-column:auto}
  .continue{grid-template-columns:auto 1fr}
  .continue .btn{grid-column:1/-1}
  .tipcard{grid-template-columns:1fr}
  .memory{grid-template-columns:repeat(3,1fr)}
  .prof-hero .mini{grid-template-columns:1fr 1fr}
  .goalpick{grid-template-columns:1fr 1fr}
  .sheet{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .toasts{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .exp-row{grid-template-columns:1fr 100px 40px}
  .exp-row.exp4{grid-template-columns:1fr 1fr 40px}
  .exp-row.exp4 input[data-f="0"]{grid-column:1/-1}
  .result .stats{grid-template-columns:repeat(3,1fr)}
  .page{padding-top:22px}
}
@media (max-width:420px){
  .match{grid-template-columns:1fr 1fr; gap:8px}
  .match .tilew{font-size:.84rem; padding:8px 10px}
  .chip.goal{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}
}
</style>
</head>
<body>

<aside class="side">

    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#CBE6C7"/><circle cx="20" cy="20" r="11" fill="#FFC49B"/><circle cx="20" cy="20" r="7.6" fill="none" stroke="#7A1E3A" stroke-width="1.4" stroke-dasharray="2 2.2"/><path d="M20 14.6v10.8M17.4 17.6c0-1.2 1.1-1.9 2.6-1.9s2.6.7 2.6 1.8c0 2.5-5.2 1.3-5.2 3.9 0 1.1 1.1 1.9 2.6 1.9s2.6-.7 2.6-1.9" fill="none" stroke="#7A1E3A" stroke-width="1.5" stroke-linecap="round"/></svg>
    <b>Payday <i>Quest</i></b>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="#home" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="#learn" data-nav="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7l10-4 10 4-10 4z"/><path d="M6 9v5c0 1.7 2.7 3 6 3s6-1.3 6-3V9M22 7v6"/></svg><span>Learn</span></a>
    <a href="#sim" data-nav="sim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg><span>Simulator</span></a>
    <a href="#games" data-nav="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 14v7M14 17.5h7"/></svg><span>Games</span></a>
    <a href="#progress" data-nav="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/></svg><span>Progress</span></a>
  </nav>
  <div class="side-card">
    <div class="row"><span>Level <b id="sLvl">1</b></span><span id="sXp">0 XP</span></div>
    <div class="bar"><i id="sBar"></i></div>
    <div class="row" style="font-size:.8rem" id="sTitle">Piggy Bank Rookie</div>
  </div>
</aside>

<div class="shell">
  <header class="topbar">
    <div class="in">
      <a class="mobile-logo" href="#home" aria-label="Payday Quest home"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#28536B"/><circle cx="20" cy="20" r="11" fill="#FFC49B"/><path d="M20 14.6v10.8M17.4 17.6c0-1.2 1.1-1.9 2.6-1.9s2.6.7 2.6 1.8c0 2.5-5.2 1.3-5.2 3.9 0 1.1 1.1 1.9 2.6 1.9s2.6-.7 2.6-1.9" fill="none" stroke="#7A1E3A" stroke-width="1.5" stroke-linecap="round"/></svg>Payday Quest</a>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="chips">
        <span class="chip streak" id="cStreak" title="Day streak"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z" fill="#F3A5BC"/><path d="M12 13c1 1.5 2.5 2.4 2.5 4.3a2.5 2.5 0 0 1-5 0c0-1.2.8-2 1.5-2.6 0 .8.4 1.3 1 1.3 0-1.2-.4-2 0-3z" fill="#7A1E3A"/></svg><span id="cStreakN">0</span></span>
        <span class="chip xp" id="cXp" title="Total XP"><svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.3 6.4.6-4.9 4.3 1.5 6.6L12 16.4 6.4 19.8l1.5-6.6L3 8.9l6.4-.6z" fill="#8FB78F" stroke="#1E3D1F" stroke-width="1.2" stroke-linejoin="round"/></svg><span id="cXpN">0</span><span class="lbl">XP</span></span>
        <span class="chip goal" id="cGoal" title="Daily goal"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="#DCE8E9" stroke-width="5"/><circle id="cGoalArc" cx="18" cy="18" r="14" fill="none" stroke="#8FB78F" stroke-width="5" stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="88" transform="rotate(-90 18 18)" style="transition:stroke-dashoffset .6s"/></svg><span id="cGoalTxt">0/30</span></span>
      </div>
    </div>
  </header>
  <main class="page" id="app" tabindex="-1"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/data-learn-2.js"></script>
